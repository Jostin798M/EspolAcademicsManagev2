<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos — Admin Facultad</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:24px; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:var(--color-surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:fadeIn .2s ease; }
    .modal-header { display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--color-border); }
    .modal-header h4 { margin:0; }
    .modal-body { padding:24px; }
    .modal-footer { padding:16px 24px;border-top:1px solid var(--color-border);display:flex;justify-content:flex-end;gap:8px;background:#FAFAFA;border-radius:0 0 var(--radius-xl) var(--radius-xl); }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-menu-toggle" id="btn-menu-toggle"><i class="bi-list"></i></button>
        <span class="topbar-title" id="topbar-title">Cursos</span>
        <nav class="breadcrumb">
          <a href="dashboard">Inicio</a>
          <i class="bi-chevron-right text-xs"></i>
          <span class="current">Cursos</span>
        </nav>
      </div>
    </header>

    <main class="page-content page-enter">
      <div class="page-header">
        <h2>Cursos de mi Facultad</h2>
        <div class="page-header-actions">
          <button class="btn btn-primary" onclick="AdminModalCurso.abrir()">
            <i class="bi-plus-lg"></i> Nuevo curso
          </button>
        </div>
      </div>

      <div id="lista-cursos-mobile" class="mobile-cards"></div>
      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Curso</th>
              <th>Profesor</th>
              <th>Estudiantes</th>
              <th>Inicio</th>
              <th>Fin</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-cursos"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Modal crear/editar curso -->
<div class="modal-overlay" id="modal-curso">
  <div class="modal-box">
    <div class="modal-header">
      <h4 id="modal-curso-titulo">Nuevo Curso</h4>
      <button class="btn btn-ghost btn-sm" onclick="AdminModalCurso.cerrar()"><i class="bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <form id="form-curso" onsubmit="return false">
        <div class="form-grid form-grid-2" style="gap:16px">
          <div class="form-group" style="grid-column:1/-1">
            <label class="form-label">Nombre <span class="required">*</span></label>
            <input type="text" id="cf-nombre" class="form-control" placeholder="Nombre del curso">
          </div>
          <div class="form-group">
            <label class="form-label">Codigo <span class="required">*</span></label>
            <input type="text" id="cf-codigo" class="form-control" placeholder="Ej: DAWM-2026A">
          </div>
          <div class="form-group">
            <label class="form-label">Profesor</label>
            <select id="cf-profesor" class="form-control">
              <option value="">Sin asignar</option>
            </select>
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label class="form-label">Descripcion</label>
            <textarea id="cf-descripcion" class="form-control" rows="2" placeholder="Descripcion del curso (opcional)"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Fecha inicio <span class="required">*</span></label>
            <input type="date" id="cf-fecha-inicio" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Fecha fin <span class="required">*</span></label>
            <input type="date" id="cf-fecha-fin" class="form-control">
          </div>
          <div class="form-group" id="grupo-estado" style="display:none">
            <label class="form-label">Estado</label>
            <select id="cf-estado" class="form-control">
              <option value="activo">Activo</option>
              <option value="archivado">Archivado</option>
            </select>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="AdminModalCurso.cerrar()">Cancelar</button>
      <button class="btn btn-primary" onclick="AdminModalCurso.guardar()">
        <i class="bi-check-lg"></i> Guardar
      </button>
    </div>
  </div>
</div>

<script src="/js/data/mockdata.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components/sidebar.js"></script>
<script src="/js/pages/auth.js"></script>
<script src="/js/pages/admin.js"></script>
<script>AdminCursos.init();</script>
</body>
</html>
